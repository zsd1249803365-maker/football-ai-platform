<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>分析方案 - Football AI</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="header">
    <h1>⚽ Football AI <span class="version">v4.4</span></h1>
    <p>智能组合方案</p>
  </div>

  <nav class="nav">
    <a href="index.html">🏠 首页</a>
    <a href="matches.html">⚽ 比赛</a>
    <a href="ai-ranking.html">📊 排行榜</a>
    <a href="ai-bet.html" class="active">🎫 方案</a>
  </nav>

  <div class="container">
    <div class="card" id="safeCard">
      <div class="card-title">⭐ 稳健方案 <span class="badge badge-risk-low">低风险</span></div>
      <div id="safe" class="loading">生成中...</div>
    </div>

    <div class="card" id="balanceCard">
      <div class="card-title">⚖️ 平衡方案 <span class="badge badge-risk-mid">中风险</span></div>
      <div id="balance" class="loading">生成中...</div>
    </div>

    <div class="card" id="riskCard">
      <div class="card-title">🔥 博冷方案 <span class="badge badge-risk-high">高风险</span></div>
      <div id="risk" class="loading">生成中...</div>
    </div>
  </div>

  <div class="footer">Football AI v4.4 · 理性参考</div>

  <script src="js/score.js"></script>
  <script>
    function renderList(list) {
      if (!list.length) return `<div class="report">暂无符合条件的比赛</div>`;
      return list.slice(0, 5).map((g, i) => `
        <div style="margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border)">
          <div class="match-name">${i + 1}. ${g.home} vs ${g.away}</div>
          <div class="match-league">${g.league}${g.kickoff ? " · " + formatKickoff(g.kickoff) : ""}</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin:6px 0;align-items:center">
            <span class="badge ${pickBadgeClass(g.pickSide)}">${g.pick}</span>
            <span class="stars">${g.starStr}</span>
          </div>
          <div style="font-size:0.85rem;color:var(--text-muted)">
            AI评分 ${g.homeScore} · 参考胜率 ${g.maxProb}% · 预测 ${g.predScore}
          </div>
          <a href="match-detail.html?game=${encodeURIComponent(g.id)}" style="font-size:0.85rem;color:var(--primary);text-decoration:none">查看详情 →</a>
        </div>
      `).join("");
    }

    loadMatches()
      .then(data => {
        const results = analyzeAll(data);
        document.getElementById("safe").innerHTML = renderList(results.filter(g => g.riskLevel === "low"));
        document.getElementById("balance").innerHTML = renderList(results.filter(g => g.riskLevel === "mid"));
        document.getElementById("risk").innerHTML = renderList(results.filter(g => g.riskLevel === "high"));
      })
      .catch(err => {
        ["safe", "balance", "risk"].forEach(id => {
          document.getElementById(id).innerHTML = `<div class="report danger">${err.message}</div>`;
        });
      });
  </script>
</body>
</html>
