<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>分析方案 - Football AI</title>
  <link rel="stylesheet" href="css/style.css?v=6.0">
</head>
<body>
  <div class="header">
    <h1>🎫 方案 <span class="version">v6.0</span></h1>
    <p>稳健 / 平衡 / 博冷 · 盘口横向一览</p>
  </div>

  <nav class="nav">
    <a href="index.html">🏠 首页</a>
    <a href="matches.html">⚽ 比赛</a>
    <a href="ai-bet.html" class="active">🎫 方案</a>
    <a href="results.html">📋 赛果</a>
  </nav>

  <div class="container">
    <div class="source-tag" id="sourceTag">生成中...</div>

    <div class="card">
      <div class="card-title">稳健方案 <span class="badge badge-risk-low">低风险</span></div>
      <div id="safe"><div class="loading">生成中...</div></div>
    </div>
    <div class="card">
      <div class="card-title">平衡方案 <span class="badge badge-risk-mid">中风险</span></div>
      <div id="balance"><div class="loading">生成中...</div></div>
    </div>
    <div class="card">
      <div class="card-title">博冷方案 <span class="badge badge-risk-high">高风险</span></div>
      <div id="risk"><div class="loading">生成中...</div></div>
    </div>
  </div>

  <div class="footer">Football AI v6.0 · 理性参考</div>

  <script src="js/score.js?v=6.0"></script>
  <script>
    function renderCard(g, i) {
      const od = g.odds || {};
      const ah = g.asian || {};
      const tt = g.totals || {};
      const alts = (g.altScoresText || []).slice(0, 2).join(" · ") || "-";
      return `
        <div style="margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--border)">
          <div class="match-name">${i + 1}. ${g.home} vs ${g.away}</div>
          <div class="match-league">${g.league}${g.kickoff ? " · " + formatKickoff(g.kickoff) : ""}</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;align-items:center">
            <span class="badge ${pickBadgeClass(g.pickSide)}">${g.pick}</span>
            <span class="badge ${riskBadgeClass(g.riskLevel)}">风险${g.risk}</span>
            <span class="stars">${g.starStr}</span>
          </div>
          <table class="odds-table">
            <thead>
              <tr>
                <th></th><th>主</th><th>平</th><th>客</th><th>让球</th><th>大</th><th>小</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td class="book">盘口</td>
                <td>${od.home ?? "-"}</td>
                <td>${od.draw ?? "-"}</td>
                <td>${od.away ?? "-"}</td>
                <td>${ah.line && ah.line !== "-" ? ah.line : "-"}</td>
                <td>${tt.over ?? "-"}</td>
                <td>${tt.under ?? "-"}</td>
              </tr>
            </tbody>
          </table>
          <div style="font-size:0.78rem;color:var(--text-muted);margin-top:8px;font-variant-numeric:tabular-nums">
            预测 <strong style="color:var(--text)">${g.predScore}</strong>（${g.predScoreProb ?? "-"}%）
            · 备选 ${alts}
            · <span style="color:var(--primary)">主${g.homeProb}% 平${g.drawProb}% 客${g.awayProb}%</span>
          </div>
          <a href="match-detail.html?game=${encodeURIComponent(g.id)}" style="display:inline-block;margin-top:10px;font-size:0.85rem;color:var(--primary);text-decoration:none">完整分析报告 →</a>
        </div>`;
    }

    function renderList(list) {
      if (!list.length) return `<div class="report">暂无符合条件的比赛</div><div class="list-end">— 本组结束 —</div>`;
      return list.slice(0, 8).map((g, i) => renderCard(g, i)).join("") +
        `<div class="list-end">— 本组 ${Math.min(list.length, 8)} 场 —</div>`;
    }

    loadMatches().then(data => {
      const results = analyzeAll(data || []);
      const srcMap = { "odds-api": "🟢 真实赔率", thesportsdb: "🟡 赛程", local: "🟡 本地", cache: "🟡 缓存" };
      document.getElementById("sourceTag").textContent =
        (srcMap[window.__DATA_SOURCE__] || "数据") + ` · ${results.length} 场参与筛选`;
      document.getElementById("safe").innerHTML = renderList(results.filter(g => g.riskLevel === "low"));
      document.getElementById("balance").innerHTML = renderList(results.filter(g => g.riskLevel === "mid"));
      document.getElementById("risk").innerHTML = renderList(results.filter(g => g.riskLevel === "high"));
    }).catch(err => {
      document.getElementById("sourceTag").textContent = "加载失败";
      ["safe","balance","risk"].forEach(id => {
        document.getElementById(id).innerHTML = `<div class="report danger">${err.message}</div>`;
      });
    });
  </script>
</body>
</html>
