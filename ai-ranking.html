<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Football AI 排行榜</title>


<style>

body{
margin:0;
padding:20px;
font-family:Arial,sans-serif;
background:#f3f4f6;
}


.header{

background:#111827;
color:white;
padding:25px;
border-radius:18px;
text-align:center;

}


.card{

background:white;
padding:20px;
margin-top:20px;
border-radius:18px;
box-shadow:0 3px 10px #ddd;

}


.match{

font-size:18px;
font-weight:bold;

}


.score{

font-size:24px;
font-weight:bold;
color:#dc2626;

}


.tag{

display:inline-block;
padding:5px 12px;
border-radius:15px;
background:#fef3c7;
margin-top:10px;

}


a{

text-decoration:none;
color:#2563eb;

}


</style>


</head>


<body>



<div class="header">

<h1>⚽ Football AI</h1>

<p>今日竞彩智能筛选 v3.3</p>

</div>



<div id="list"></div><div id="list"></div>


<script>


fetch("matches.json")

.then(res=>res.json())

.then(data=>{


let result=[];



data.forEach(match=>{



let score=

80+

(match.strength.home-match.strength.away)*0.3+

(match.form.home-match.form.away)*0.2+

(match.xg.home-match.xg.away)*10+

(match.defense.home-match.defense.away)*0.15+

match.ai_market.odds_change+

match.ai_market.handicap_support+

match.ai_market.heat_risk+

match.injury.home.totalImpact+

match.motivation.impact+

match.schedule.fatigue+

match.rotation.impact+

match.style_match.impact+

match.market_logic.impact;




let awayScore=

160-score+
match.injury.away.totalImpact;



let diff=score-awayScore;



let homeProb=

Math.max(5,33+diff*1.5);



let awayProb=

Math.max(5,33-diff*1.2);



let drawProb=

100-homeProb-awayProb;




let pick="";



if(homeProb>awayProb&&homeProb>drawProb){

pick="主胜";

}

else if(awayProb>homeProb&&awayProb>drawProb){

pick="客胜";

}

else{

pick="防平";

}




let risk="";


if(Math.abs(homeProb-awayProb)<10){

risk="高风险";

}

else if(Math.abs(homeProb-awayProb)<20){

risk="中风险";

}

else{

risk="低风险";

}




let level="⭐⭐⭐";


if(score>awayScore+20){

level="⭐⭐⭐⭐⭐";

}

else if(score>awayScore+10){

level="⭐⭐⭐⭐";

}




result.push({

id:match.id,

home:match.home,

away:match.away,

score:score,

pick:pick,

risk:risk,

level:level

});



});





// AI评分排序


result.sort(function(a,b){

return b.score-a.score;

});





let html="";



result.forEach(function(item,index){



html+=

'<div class="card">'+


'<div class="match">'+

(index+1)+". "+

item.home+

" VS "+

item.away+

'</div>'+



'<p>AI评分：</p>'+

'<div class="score">'+

item.score.toFixed(1)+

'</div>'+



'<p>推荐：'+

item.pick+

'</p>'+



'<p>风险：'+

item.risk+

'</p>'+



'<div class="tag">'+

item.level+

'</div>'+



'<br><br>'+



'<a href="match-detail.html?game='+

item.id+

'">查看详细分析</a>'+



'</div>';



});





document.getElementById("list").innerHTML=
html;



});



</script>


</body>


</html>
