<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 排行榜 - Football AI</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="header">
    <h1>⚽ Football AI <span class="version">v4.4</span></h1>
    <p>AI 智能筛选排行榜</p>
  </div>

  <nav class="nav">
    <a href="index.html">🏠 首页</a>
    <a href="matches.html">⚽ 比赛</a>
    <a href="ai-ranking.html" class="active">📊 排行榜</a>
    <a href="ai-bet.html">🎫 方案</a>
  </nav>

  <div class="container">
    <div id="list" class="loading">正在计算排名...</div>
  </div>

  <div class="footer">Football AI v4.4 · 评分越高越推荐</div>

  <script src="js/score.js"></script>
  <script>
    loadMatches()
      .then(data => {
        const results = analyzeAll(data);
        let html = "";
        results.forEach((item, index) => {
          html += `
            <div class="card">
              <div class="match-name">${index + 1}. ${item.home} vs ${item.away}</div>
              <div class="match-league">${item.league}${item.kickoff ? " · " + formatKickoff(item.kickoff) : ""}</div>
              <div class="score-big">${item.homeScore}</div>
              <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0">
                <span class="badge ${pickBadgeClass(item.pickSide)}">推荐：${item.pick}</span>
                <span class="badge ${riskBadgeClass(item.riskLevel)}">风险：${item.risk}</span>
                <span class="stars">${item.starStr}</span>
              </div>
              <div class="info-grid" style="margin-bottom:12px">
                <div class="info-item">
                  <div class="label">主胜</div>
                  <div class="value">${item.homeProb}%</div>
                  <div class="prob-bar"><div class="prob-bar-fill prob-home" style="width:${item.homeProb}%"></div></div>
                </div>
                <div class="info-item">
                  <div class="label">平局</div>
                  <div class="value">${item.drawProb}%</div>
                  <div class="prob-bar"><div class="prob-bar-fill prob-draw" style="width:${item.drawProb}%"></div></div>
                </div>
                <div class="info-item">
                  <div class="label">客胜</div>
                  <div class="value">${item.awayProb}%</div>
                  <div class="prob-bar"><div class="prob-bar-fill prob-away" style="width:${item.awayProb}%"></div></div>
                </div>
                <div class="info-item">
                  <div class="label">预测比分</div>
                  <div class="value">${item.predScore}</div>
                </div>
              </div>
              <a class="btn btn-dark" href="match-detail.html?game=${encodeURIComponent(item.id)}">查看详细分析</a>
            </div>`;
        });
        document.getElementById("list").innerHTML = html || "<div class=\"card\">暂无数据</div>";
      })
      .catch(err => {
        document.getElementById("list").innerHTML =
          `<div class="card"><div class="report danger">读取失败：${err.message}</div></div>`;
      });
  </script>
</body>
</html>
