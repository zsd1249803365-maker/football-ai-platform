<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>AI 排行榜 - Football AI</title>
  <link rel="stylesheet" href="css/style.css?v=5.3">
  <style>
    .odds-box {
      margin-top: 10px;
      padding: 10px 12px;
      background: rgba(10,15,13,0.55);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.55;
      font-variant-numeric: tabular-nums;
    }
    .odds-row { margin-bottom: 2px; }
    .odds-prob { color: var(--primary); font-weight: 600; margin-top: 4px; }
    .list-end {
      text-align: center;
      color: var(--text-dim);
      font-size: 0.82rem;
      padding: 18px 8px 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>⚽ Football AI <span class="version">v5.3</span></h1>
    <p>AI 智能筛选排行榜</p>
  </div>

  <nav class="nav">
    <a href="index.html">🏠 首页</a>
    <a href="matches.html">⚽ 比赛</a>
    <a href="ai-ranking.html" class="active">📊 排行榜</a>
    <a href="ai-bet.html">🎫 方案</a>
  </nav>

  <div class="container">
    <div id="list"><div class="loading">正在计算排名...</div></div>
  </div>

  <div class="footer">Football AI v5.3 · 评分越高越推荐</div>

  <script src="js/score.js?v=5.3"></script>
  <script>
    loadMatches()
      .then(data => {
        const results = analyzeAll(data || []);
        if (!results.length) {
          document.getElementById("list").innerHTML =
            `<div class="card"><div class="report">暂无数据</div></div>
             <div class="list-end">— 已结束 —</div>`;
          return;
        }
        let html = "";
        results.forEach((item, index) => {
          html += `
            <div class="card">
              <div class="match-name">${index + 1}. ${item.home} vs ${item.away}</div>
              <div class="match-league">${item.league}${item.kickoff ? " · " + formatKickoff(item.kickoff) : ""}</div>
              <div class="score-big">${item.homeScore}</div>
              <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0">
                <span class="badge ${pickBadgeClass(item.pickSide)}">推荐：${item.pick}</span>
                <span class="badge ${riskBadgeClass(item.riskLevel)}">风险：${item.risk}</span>
                <span class="stars">${item.starStr}</span>
              </div>
              ${oddsSnippet(item)}
              <a class="btn btn-dark" href="match-detail.html?game=${encodeURIComponent(item.id)}">查看详细分析</a>
            </div>`;
        });
        html += `<div class="list-end">— 共 ${results.length} 场，已全部显示 —</div>`;
        document.getElementById("list").innerHTML = html;
      })
      .catch(err => {
        document.getElementById("list").innerHTML =
          `<div class="card"><div class="report danger">读取失败：${err.message}</div></div>
           <div class="list-end">— 结束 —</div>`;
      });
  </script>
</body>
</html>
