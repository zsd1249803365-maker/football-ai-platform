<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Football AI - 比赛列表</title>


<style>

body{
    margin:0;
    padding:20px;
    font-family:Arial,sans-serif;
    background:#f4f6f8;
}


.header{

    background:#111827;
    color:white;
    padding:25px;
    text-align:center;
    border-radius:18px;

}


.card{

    background:white;
    margin-top:20px;
    padding:20px;
    border-radius:18px;
    box-shadow:0 3px 10px #ddd;
    cursor:pointer;

}


.card:hover{

    transform:scale(1.02);

}


.league{

    color:#666;

}


.match{

    font-size:22px;
    font-weight:bold;
    margin-top:10px;

}


a{

    text-decoration:none;
    color:#111;

}


</style>


</head>



<body>



<div class="header">

<h1>⚽ Football AI</h1>

<p>智能足球预测平台</p>

</div>




<div id="matches">

加载比赛中...

</div>






<script>


fetch("matches.json")

.then(response => response.json())

.then(data => {



let html="";



data.forEach(match => {



html += `


<a href="match-detail.html?game=${match.id}">


<div class="card">


<div class="league">

${match.league}

</div>



<div class="match">

${match.home} VS ${match.away}

</div>


</div>


</a>


`;



});



document.getElementById("matches").innerHTML=html;



});


</script>




</body>

</html>
