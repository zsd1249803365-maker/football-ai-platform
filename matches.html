<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>比赛列表 - Football AI</title>
  <link rel="stylesheet" href="css/style.css?v=6.0">
</head>
<body>
  <div class="header">
    <h1>⚽ 比赛 <span class="version">v6.0</span></h1>
    <p>按联赛筛选 · 点进详情看盘口 / 积分 / 战绩</p>
  </div>

  <nav class="nav">
    <a href="index.html">🏠 首页</a>
    <a href="matches.html" class="active">⚽ 比赛</a>
    <a href="ai-bet.html">🎫 方案</a>
    <a href="results.html">📋 赛果</a>
  </nav>

  <div class="container">
    <div class="source-tag" id="sourceTag">加载中...</div>

    <div class="filters" id="leagueFilters">
      <button type="button" class="filter-btn active" data-league="">全部</button>
      <button type="button" class="filter-btn" data-league="美职联">美职联</button>
      <button type="button" class="filter-btn" data-league="巴甲">巴甲</button>
      <button type="button" class="filter-btn" data-league="挪超">挪超</button>
      <button type="button" class="filter-btn" data-league="瑞典超">瑞典超</button>
      <button type="button" class="filter-btn" data-league="英超">英超</button>
      <button type="button" class="filter-btn" data-league="西甲">西甲</button>
      <button type="button" class="filter-btn" data-league="德甲">德甲</button>
      <button type="button" class="filter-btn" data-league="意甲">意甲</button>
      <button type="button" class="filter-btn" data-league="法甲">法甲</button>
    </div>

    <div class="card" id="listWrap">
      <div id="list"><div class="loading">正在加载...</div></div>
    </div>
  </div>

  <div class="footer">Football AI v6.0 · 列表仅显示对阵与时间</div>

  <script src="js/score.js?v=6.0"></script>
  <script>
    let allResults = [];
    let currentLeague = "";

    function render() {
      let list = allResults;
      if (currentLeague) {
        list = list.filter(g => g.league === currentLeague || String(g.league).includes(currentLeague));
      }
      if (!list.length) {
        document.getElementById("list").innerHTML =
          `<div class="report">暂无比赛</div><div class="list-end">— 结束 —</div>`;
        return;
      }
      // 按联赛分组
      const groups = {};
      list.forEach(g => {
        const k = g.league || "其他";
        if (!groups[k]) groups[k] = [];
        groups[k].push(g);
      });
      let html = "";
      Object.keys(groups).forEach(league => {
        html += `<div style="font-size:0.78rem;color:var(--primary);font-weight:650;margin:14px 0 6px;letter-spacing:0.04em">${league}</div>`;
        groups[league].forEach(g => {
          html += `<a class="match-row" href="match-detail.html?game=${encodeURIComponent(g.id)}">
            <div style="flex:1;min-width:0">
              <div class="teams">${g.home} vs ${g.away}</div>
              <div class="meta">${formatKickoff(g.kickoff) || "时间待定"}</div>
            </div>
            <div class="arrow">›</div>
          </a>`;
        });
      });
      html += `<div class="list-end">— 共 ${list.length} 场，已全部显示 —</div>`;
      document.getElementById("list").innerHTML = html;
    }

    function load(league) {
      document.getElementById("list").innerHTML = `<div class="loading">加载中...</div>`;
      loadMatches(league || undefined).then(data => {
        allResults = analyzeAllByDate(data || []);
        const srcMap = { "odds-api": "🟢 真实赔率", thesportsdb: "🟡 赛程", local: "🟡 本地", cache: "🟡 缓存" };
        document.getElementById("sourceTag").textContent =
          (srcMap[window.__DATA_SOURCE__] || "数据") + ` · ${allResults.length} 场 · 点击进入详情`;
        render();
      }).catch(err => {
        document.getElementById("list").innerHTML =
          `<div class="report danger">${err.message}</div><div class="list-end">— 结束 —</div>`;
      });
    }

    document.querySelectorAll("#leagueFilters .filter-btn").forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll("#leagueFilters .filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentLeague = btn.dataset.league || "";
        load(currentLeague);
      };
    });
    load("");
  </script>
</body>
</html>
