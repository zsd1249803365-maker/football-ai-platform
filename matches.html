<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>比赛列表 - Football AI</title>
  <link rel="stylesheet" href="css/style.css?v=6.3">
  <style>
    .date-bar {
      display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 12px;
      -webkit-overflow-scrolling: touch; scrollbar-width: none;
    }
    .date-bar::-webkit-scrollbar { display: none; }
    .date-chip {
      flex: 0 0 auto; min-width: 52px; padding: 10px 12px;
      border-radius: 12px; border: 1px solid var(--border);
      background: transparent; color: var(--text-muted);
      text-align: center; cursor: pointer; font-family: inherit;
    }
    .date-chip .d { font-size: 1.15rem; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--text); }
    .date-chip .w { font-size: 0.68rem; margin-top: 2px; }
    .date-chip .n { font-size: 0.65rem; color: var(--text-dim); margin-top: 2px; }
    .date-chip.active {
      background: var(--primary-glow); border-color: var(--primary-ring); color: var(--primary);
    }
    .date-chip.active .d { color: var(--primary); }
    /* 禁止列表里出现 loading 动画残留 */
    #list .loading { display: none; }
  </style>
</head>
<body>
  <div class="header">
    <h1>⚽ 比赛 <span class="version">v6.3</span></h1>
    <p>点日期筛选 · 点「全部」看所有</p>
  </div>

  <nav class="nav">
    <a href="index.html">🏠 首页</a>
    <a href="matches.html" class="active">⚽ 比赛</a>
    <a href="ai-bet.html">🎫 方案</a>
    <a href="results.html">📋 赛果</a>
  </nav>

  <div class="container">
    <div class="source-tag" id="sourceTag">加载中...</div>
    <div class="date-bar" id="dateBar"></div>
    <div class="filters" id="leagueFilters">
      <button type="button" class="filter-btn active" data-league="">全部联赛</button>
      <button type="button" class="filter-btn" data-league="英超">英超</button>
      <button type="button" class="filter-btn" data-league="西甲">西甲</button>
      <button type="button" class="filter-btn" data-league="意甲">意甲</button>
      <button type="button" class="filter-btn" data-league="德甲">德甲</button>
      <button type="button" class="filter-btn" data-league="法甲">法甲</button>
      <button type="button" class="filter-btn" data-league="欧冠">欧冠</button>
      <button type="button" class="filter-btn" data-league="欧联">欧联</button>
      <button type="button" class="filter-btn" data-league="欧协联">欧协联</button>
      <button type="button" class="filter-btn" data-league="美职联">美职联</button>
      <button type="button" class="filter-btn" data-league="巴甲">巴甲</button>
      <button type="button" class="filter-btn" data-league="芬超">芬超</button>
      <button type="button" class="filter-btn" data-league="挪超">挪超</button>
      <button type="button" class="filter-btn" data-league="瑞典超">瑞典超</button>
    </div>
    <div class="card" id="listCard">
      <div id="list"><div id="loadHint" class="loading">正在加载...</div></div>
    </div>
  </div>

  <div class="footer">Football AI v6.3</div>

  <script src="js/score.js?v=6.3"></script>
  <script>
    let allResults = [];
    let currentLeague = "";
    let currentDate = "ALL"; // ALL = 全部日期，不要用空字符串被重置

    function dateKey(iso) {
      if (!iso) return "";
      try {
        const d = new Date(iso);
        if (isNaN(d.getTime())) return String(iso).slice(0, 10);
        return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
      } catch { return String(iso).slice(0, 10); }
    }

    function buildDateBar() {
      const counts = {};
      allResults.forEach(g => {
        const k = dateKey(g.kickoff);
        if (!k) return;
        counts[k] = (counts[k] || 0) + 1;
      });
      const keys = Object.keys(counts).sort();
      const bar = document.getElementById("dateBar");
      if (!keys.length) { bar.innerHTML = ""; return; }

      // 若当前选中的具体日期已不存在，才回退到 ALL
      if (currentDate !== "ALL" && !counts[currentDate]) currentDate = "ALL";

      const week = ["日","一","二","三","四","五","六"];
      let html = `<button type="button" class="date-chip ${currentDate==="ALL"?"active":""}" data-date="ALL">
        <div class="d">全</div><div class="w">部</div><div class="n">${allResults.length}</div>
      </button>`;
      keys.forEach(k => {
        const d = new Date(k + "T12:00:00");
        html += `<button type="button" class="date-chip ${currentDate===k?"active":""}" data-date="${k}">
          <div class="d">${d.getDate()}</div><div class="w">周${week[d.getDay()]}</div><div class="n">${counts[k]}场</div>
        </button>`;
      });
      bar.innerHTML = html;
      bar.querySelectorAll(".date-chip").forEach(btn => {
        btn.onclick = () => {
          currentDate = btn.dataset.date || "ALL";
          // 只更新选中样式，不要重建时改 currentDate
          bar.querySelectorAll(".date-chip").forEach(b => b.classList.toggle("active", b.dataset.date === currentDate));
          render();
        };
      });
    }

    function render() {
      let list = allResults.slice();
      if (currentLeague) {
        list = list.filter(g => g.league === currentLeague || String(g.league).includes(currentLeague));
      }
      if (currentDate && currentDate !== "ALL") {
        list = list.filter(g => dateKey(g.kickoff) === currentDate);
      }

      const box = document.getElementById("list");
      if (!list.length) {
        box.innerHTML = `<div class="report">该筛选下暂无比赛</div><div class="list-end">— 共 0 场，已全部显示 —</div>`;
        return;
      }

      const groups = {};
      list.forEach(g => {
        const k = g.league || "其他";
        if (!groups[k]) groups[k] = [];
        groups[k].push(g);
      });
      let html = "";
      Object.keys(groups).forEach(league => {
        html += `<div style="font-size:0.78rem;color:var(--primary);font-weight:650;margin:14px 0 6px">${league}（${groups[league].length}）</div>`;
        groups[league].forEach(g => {
          html += `<a class="match-row" href="match-detail.html?game=${encodeURIComponent(g.id)}">
            <div style="flex:1;min-width:0">
              <div class="teams">${g.home} vs ${g.away}</div>
              <div class="meta">${formatKickoff(g.kickoff) || "时间待定"}</div>
            </div>
            <div class="arrow">›</div>
          </a>`;
        });
      });
      html += `<div class="list-end">— 共 ${list.length} 场，已全部显示，没有更多了 —</div>`;
      box.innerHTML = html;
    }

    function load() {
      const box = document.getElementById("list");
      box.innerHTML = `<div class="loading">正在加载全部联赛...</div>`;
      // 不带 league 参数，一次拉全量
      loadMatches().then(data => {
        allResults = analyzeAllByDate(data || []);
        const srcMap = { "odds-api": "🟢 真实赔率", thesportsdb: "🟡 赛程", local: "🟡 本地", cache: "🟡 缓存" };
        const note = window.__DATA_NOTE__ || "";
        document.getElementById("sourceTag").textContent =
          (srcMap[window.__DATA_SOURCE__] || "数据") + ` · ${allResults.length} 场` + (note ? " · " + note : "");
        currentDate = "ALL";
        buildDateBar();
        render();
      }).catch(err => {
        box.innerHTML = `<div class="report danger">${err.message}</div><div class="list-end">— 结束 —</div>`;
      });
    }

    document.querySelectorAll("#leagueFilters .filter-btn").forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll("#leagueFilters .filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentLeague = btn.dataset.league || "";
        buildDateBar();
        render();
      };
    });

    load();
  </script>
</body>
</html>
