<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>比赛列表 - Football AI</title>
  <link rel="stylesheet" href="css/style.css?v=5.2">
</head>
<body>
  <div class="header">
    <h1>⚽ Football AI <span class="version">v5.2</span></h1>
    <p>比赛列表 · 按开赛时间 · 真实赔率</p>
  </div>

  <nav class="nav">
    <a href="index.html">🏠 首页</a>
    <a href="matches.html" class="active">⚽ 比赛</a>
    <a href="ai-ranking.html">📊 排行榜</a>
    <a href="ai-bet.html">🎫 方案</a>
  </nav>

  <div class="container">
    <div class="source-tag" id="sourceTag">数据来源加载中...</div>

    <div class="filters" id="leagueFilters">
      <button class="filter-btn active" data-league="">全部</button>
      <button class="filter-btn" data-league="美职联">美职联</button>
      <button class="filter-btn" data-league="巴甲">巴甲</button>
      <button class="filter-btn" data-league="挪超">挪超</button>
      <button class="filter-btn" data-league="瑞典超">瑞典超</button>
      <button class="filter-btn" data-league="英超">英超</button>
      <button class="filter-btn" data-league="西甲">西甲</button>
      <button class="filter-btn" data-league="德甲">德甲</button>
    </div>

    <div class="filters" id="riskFilters">
      <button class="filter-btn active" data-risk="">全部风险</button>
      <button class="filter-btn" data-risk="low">低风险</button>
      <button class="filter-btn" data-risk="mid">中风险</button>
      <button class="filter-btn" data-risk="high">高风险</button>
    </div>

    <div id="list" class="loading">正在加载比赛...</div>
  </div>

  <div class="footer">Football AI v5.2 · 仅供参考</div>

  <script src="js/score.js?v=5.2"></script>
  <script>
    let allResults = [];
    let currentLeague = "";
    let currentRisk = "";

    function render() {
      let list = allResults;
      if (currentLeague) {
        list = list.filter(g => g.league === currentLeague || String(g.league).includes(currentLeague));
      }
      if (currentRisk) list = list.filter(g => g.riskLevel === currentRisk);
      if (!list.length) {
        document.getElementById("list").innerHTML =
          `<div class="card"><div class="report">暂无符合条件的比赛</div></div>`;
        return;
      }
      let html = "";
      list.forEach(g => {
        const oddsText = g.odds
          ? `主 ${g.odds.home} / 平 ${g.odds.draw} / 客 ${g.odds.away}`
          : "";
        html += `
          <div class="card">
            <div class="match-name">${g.home} vs ${g.away}</div>
            <div class="match-league">${g.league}${g.kickoff ? " · " + formatKickoff(g.kickoff) : ""}</div>
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0">
              <span class="badge ${pickBadgeClass(g.pickSide)}">${g.pick}</span>
              <span class="badge ${riskBadgeClass(g.riskLevel)}">风险${g.risk}</span>
              <span class="stars">${g.starStr}</span>
            </div>
            <div class="info-grid">
              <div class="info-item"><div class="label">AI 评分</div><div class="value">${g.homeScore}</div></div>
              <div class="info-item"><div class="label">主胜概率</div><div class="value">${g.homeProb}%</div></div>
            </div>
            ${oddsText ? `<div style="font-size:0.8rem;color:var(--text-dim);margin-top:10px;font-variant-numeric:tabular-nums">赔率：${oddsText}</div>` : ""}
            <a class="btn btn-dark" href="match-detail.html?game=${encodeURIComponent(g.id)}">查看 AI 详细分析</a>
          </div>`;
      });
      document.getElementById("list").innerHTML = html;
    }

    function bindFilters() {
      document.querySelectorAll("#leagueFilters .filter-btn").forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll("#leagueFilters .filter-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          currentLeague = btn.dataset.league;
          load(currentLeague);
        };
      });
      document.querySelectorAll("#riskFilters .filter-btn").forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll("#riskFilters .filter-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          currentRisk = btn.dataset.risk;
          render();
        };
      });
    }

    function load(league) {
      document.getElementById("list").innerHTML = `<div class="loading">正在加载...</div>`;
      loadMatches(league || undefined)
        .then(data => {
          allResults = analyzeAllByDate(data);
          const srcMap = {
            "odds-api": "🟢 真实赔率（The Odds API）",
            thesportsdb: "🟡 综合赛程",
            local: "🟡 本地",
            cache: "🟡 缓存",
          };
          const src = srcMap[window.__DATA_SOURCE__] || "数据";
          document.getElementById("sourceTag").textContent =
            src + ` · 共 ${allResults.length} 场 · 按开赛时间排序`;
          render();
        })
        .catch(err => {
          document.getElementById("list").innerHTML =
            `<div class="card"><div class="report danger">读取失败：${err.message}</div></div>`;
        });
    }

    bindFilters();
    load("");
  </script>
</body>
</html>
