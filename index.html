<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Football AI</title>
  <link rel="stylesheet" href="css/style.css?v=6.0">
</head>
<body>
  <div class="header">
    <h1>⚽ Football AI <span class="version">v6.0</span></h1>
    <p>赛程 · 盘口 · 多维分析</p>
  </div>

  <nav class="nav">
    <a href="index.html" class="active">🏠 首页</a>
    <a href="matches.html">⚽ 比赛</a>
    <a href="ai-bet.html">🎫 方案</a>
    <a href="results.html">📋 赛果</a>
  </nav>

  <div class="container">
    <div class="card">
      <div class="card-title">入口</div>
      <a class="btn btn-primary" href="matches.html">⚽ 比赛列表（按联赛 / 日期）</a>
      <a class="btn btn-warning" href="ai-bet.html">🎫 分析方案</a>
      <a class="btn btn-dark" href="results.html">📋 赛果对比（预测 vs 实际）</a>
    </div>

    <div class="card">
      <div class="card-title">数据状态</div>
      <div id="dataStatus" style="font-size:0.9rem;color:var(--text-muted)">检测中...</div>
      <div id="dataNote" style="font-size:0.8rem;color:var(--text-dim);margin-top:8px"></div>
    </div>

    <div class="card">
      <div class="card-title">今日概览</div>
      <div id="statistics" class="loading">读取中...</div>
    </div>

    <div class="card">
      <div class="card-title">即将开赛</div>
      <div id="topGames" class="loading">加载中...</div>
    </div>
  </div>

  <div class="footer">Football AI v6.0 · 仅供参考</div>

  <script src="js/score.js?v=6.0"></script>
  <script>
    loadMatches().then(data => {
      const byDate = analyzeAllByDate(data || []);
      const results = analyzeAll(data || []);
      const srcMap = {
        "odds-api": "🟢 真实赔率（The Odds API）",
        thesportsdb: "🟡 综合赛程",
        local: "🟡 本地", cache: "🟡 缓存",
      };
      document.getElementById("dataStatus").textContent =
        (srcMap[window.__DATA_SOURCE__] || "在线") + ` · ${results.length} 场`;
      if (window.__DATA_NOTE__) document.getElementById("dataNote").textContent = window.__DATA_NOTE__;

      document.getElementById("statistics").innerHTML = `
        <div class="stats-row">
          <div class="stat-box"><div class="num">${results.length}</div><div class="label">待赛</div></div>
          <div class="stat-box"><div class="num" style="color:var(--success)">${results.filter(r=>r.pickSide==="home").length}</div><div class="label">倾向主</div></div>
          <div class="stat-box"><div class="num" style="color:var(--warning)">${results.filter(r=>r.pickSide==="draw").length}</div><div class="label">倾向平</div></div>
          <div class="stat-box"><div class="num" style="color:var(--danger)">${results.filter(r=>r.pickSide==="away").length}</div><div class="label">倾向客</div></div>
        </div>`;

      let html = "";
      byDate.slice(0, 8).forEach(g => {
        html += `<a class="match-row" href="match-detail.html?game=${encodeURIComponent(g.id)}">
          <div>
            <div class="teams">${g.home} vs ${g.away}</div>
            <div class="meta">${g.league}</div>
          </div>
          <div class="time">${formatKickoff(g.kickoff) || "待定"} ›</div>
        </a>`;
      });
      document.getElementById("topGames").innerHTML = html || "暂无";
    }).catch(err => {
      document.getElementById("dataStatus").textContent = "加载失败";
      document.getElementById("statistics").innerHTML = `<div class="report danger">${err.message}</div>`;
      document.getElementById("topGames").innerHTML = "";
    });
  </script>
</body>
</html>
