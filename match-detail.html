<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Football AI - 比赛分析</title>

<style>

body{
    margin:0;
    padding:20px;
    font-family:Arial,sans-serif;
    background:#f3f4f6;
}

.header{
    background:#111827;
    color:white;
    padding:25px;
    border-radius:18px;
    text-align:center;
}

.card{
    background:white;
    margin-top:20px;
    padding:20px;
    border-radius:18px;
    box-shadow:0 3px 10px #ddd;
}

.title{
    font-size:20px;
    font-weight:bold;
    margin-bottom:15px;
}

.info{
    font-size:17px;
    line-height:35px;
}

.big{
    font-size:28px;
    font-weight:bold;
}

.back{

    display:block;
    margin-top:25px;
    padding:15px;
    background:#111827;
    color:white;
    text-align:center;
    border-radius:12px;
    text-decoration:none;

}

</style>

</head>


<body>


<div class="header">

<h1>⚽ Football AI</h1>

<p>智能足球预测分析</p>

</div>



<div class="card">

<div class="title">
比赛
</div>

<h2 id="matchName">
加载中...
</h2>

<p id="league"></p>

</div>




<div class="card">

<div class="title">
🔥 球队实力
</div>

<div class="info" id="strength">

加载中...

</div>

</div>





<div class="card">

<div class="title">
📊 近期状态
</div>

<div class="info" id="form">

加载中...

</div>

</div>





<div class="card">

<div class="title">
📈 xG预期进球

</div>

<div class="info" id="xg">

加载中...

</div>

</div>





<div class="card">

<div class="title">
🛡 防守能力

</div>

<div class="info" id="defense">

加载中...

</div>

</div>





<div class="card">

<div class="title">
💰 赔率分析

</div>

<div class="info" id="odds">

加载中...

</div>

</div>





<div class="card">

<div class="title">
🤖 AI预测

</div>

<div class="info" id="prediction">

加载中...

</div>

</div>





<div class="card">

<div class="title">
⚠️ 风险等级

</div>

<div class="big" id="risk">

加载中...

</div>

</div>





<a class="back" href="matches.html">

返回比赛列表

</a>






<script>


let params = new URLSearchParams(window.location.search);

let game = params.get("game");



fetch("matches.json")

.then(response => response.json())

.then(data => {


let match = data.find(item => item.id == game);



if(match){


document.getElementById("matchName").innerHTML =
match.home + " VS " + match.away;



document.getElementById("league").innerHTML =
match.league;



document.getElementById("strength").innerHTML =

match.home + "：" + match.team_strength.home +
"<br>" +

match.away + "：" + match.team_strength.away;



document.getElementById("form").innerHTML =

match.home + "：" + match.form.home +
"<br>" +

match.away + "：" + match.form.away;



document.getElementById("xg").innerHTML =

match.home + " xG：" + match.xg.home +
"<br>" +

match.away + " xG：" + match.xg.away;



document.getElementById("defense").innerHTML =

match.home + "：" + match.defense.home +
"<br>" +

match.away + "：" + match.defense.away;



document.getElementById("odds").innerHTML =

"主胜：" + match.odds.home_win +
"<br>平：" + match.odds.draw +
"<br>客胜：" + match.odds.away_win;



document.getElementById("prediction").innerHTML =

"胜：" + match.prediction.win +
"<br>平：" + match.prediction.draw +
"<br>负：" + match.prediction.lose +
"<br>预测比分：" + match.prediction.score;



document.getElementById("risk").innerHTML =

match.risk;



}

else{

document.getElementById("matchName").innerHTML =
"没有找到比赛";

}



});


</script>


</body>

</html>
