<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Football AI 分析</title>

<style>

body{
    margin:0;
    padding:20px;
    font-family:Arial;
    background:#f3f4f6;
}

.header{
    background:#111827;
    color:white;
    padding:25px;
    border-radius:18px;
    text-align:center;
}

.card{
    background:white;
    padding:20px;
    margin-top:20px;
    border-radius:18px;
    box-shadow:0 3px 10px #ddd;
}

.title{
    font-size:20px;
    font-weight:bold;
    margin-bottom:15px;
}

.info{
    font-size:17px;
    line-height:32px;
}

.score{
    font-size:26px;
    font-weight:bold;
}

.back{

    display:block;
    margin-top:25px;
    background:#111827;
    color:white;
    padding:15px;
    text-align:center;
    border-radius:12px;
    text-decoration:none;

}

</style>

</head>


<body>


<div class="header">

<h1>⚽ Football AI</h1>

<p>AI足球预测分析系统</p>

</div>




<div class="card">

<div class="title">
比赛
</div>

<h2 id="matchName">
加载中...
</h2>

<p id="league"></p>

</div>





<div class="card">

<div class="title">
🔥 球队实力
</div>

<div class="info" id="strength">
加载中...
</div>

</div>





<div class="card">

<div class="title">
📊 近期状态
</div>

<div class="info" id="form">
加载中...
</div>

</div>





<div class="card">

<div class="title">
📈 xG数据
</div>

<div class="info" id="xg">
加载中...
</div>

</div>





<div class="card">

<div class="title">
🛡 防守能力
</div>

<div class="info" id="defense">
加载中...
</div>

</div>





<div class="card">

<div class="title">
💰 盘口赔率
</div>

<div class="info" id="odds">
加载中...
</div>

</div>





<div class="card">

<div class="title">
🤖 AI综合评分
</div>

<div class="info" id="aiScore">
计算中...
</div>

</div>





<div class="card">

<div class="title">
🎯 AI预测
</div>

<div class="info" id="prediction">
加载中...
</div>

</div>





<div class="card">

<div class="title">
⚠️ 风险等级
</div>

<div class="score" id="risk">
加载中...
</div>

</div>





<a class="back" href="matches.html">

返回比赛列表

</a>






<script>


let params = new URLSearchParams(window.location.search);

let game = params.get("game");



fetch("matches.json")

.then(res => res.json())

.then(data => {


let match = data.find(item => item.id == game);



if(match){


document.getElementById("matchName").innerHTML =
match.home + " VS " + match.away;


document.getElementById("league").innerHTML =
match.league;




document.getElementById("strength").innerHTML =

match.home + "：" + match.strength.home +
"<br>" +
match.away + "：" + match.strength.away;



document.getElementById("form").innerHTML =

match.home + "：" + match.form.detail.home +
"<br>" +
match.away + "：" + match.form.detail.away;



document.getElementById("xg").innerHTML =

match.home + "：" + match.xg.home +
"<br>" +
match.away + "：" + match.xg.away;



document.getElementById("defense").innerHTML =

match.home + "：" + match.defense.home +
"<br>" +
match.away + "：" + match.defense.away;



document.getElementById("odds").innerHTML =

"主胜：" + match.odds.home +
"<br>平：" + match.odds.draw +
"<br>客胜：" + match.odds.away;




// AI评分计算


let strength =
(match.strength.home - match.strength.away) * 0.3;


let form =
(match.form.home - match.form.away) * 0.2;


let xg =
(match.xg.home - match.xg.away) * 10;


let defense =
(match.defense.home - match.defense.away) * 0.15;


let market =
(match.odds.away - match.odds.home) * 2;



let homeScore =
80 +
strength +
form +
xg +
defense +
market;



let awayScore =
100 - homeScore;



if(awayScore < 50){

awayScore = 50;

}



document.getElementById("aiScore").innerHTML =

match.home + " AI评分：" +
homeScore.toFixed(1) +

"<br>" +

match.away + " AI评分：" +
awayScore.toFixed(1) +

"<br><br>" +

"AI倾向：" +

(match.home + " 方向");





document.getElementById("prediction").innerHTML =

"主胜：" + match.prediction.home_win +
"<br>平：" + match.prediction.draw +
"<br>客胜：" + match.prediction.away_win +
"<br>预测比分：" + match.prediction.score;



document.getElementById("risk").innerHTML =
match.risk;



}

else{

document.getElementById("matchName").innerHTML =
"未找到比赛";

}



});


</script>


</body>

</html>
