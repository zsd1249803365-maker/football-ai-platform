<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>单场分析 - Football AI</title>
  <link rel="stylesheet" href="css/style.css?v=5.2">
  <style>
    .report-block { white-space: pre-wrap; line-height: 1.8; font-size: 0.92rem; }
  </style>
</head>
<body>
  <div class="header">
    <h1>⚽ Football AI <span class="version">v5.2</span></h1>
    <p>单场深度分析 · 泊松比分 · 盘口解读</p>
  </div>

  <nav class="nav">
    <a href="index.html">🏠 首页</a>
    <a href="matches.html">⚽ 比赛</a>
    <a href="ai-ranking.html">📊 排行榜</a>
    <a href="ai-bet.html">🎫 方案</a>
  </nav>

  <div class="container" id="content">
    <div class="loading">正在生成分析报告...</div>
  </div>

  <div class="footer">Football AI v5.2 · 仅供参考</div>

  <script src="js/score.js?v=5.2"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const gameId = params.get("game");

    function render(match) {
      const a = analyzeMatch(match);
      const m = match;
      const srcLabel = a.source === "odds-api" ? "🟢 联网真实赔率" : "🟡 估算/赛程";

      document.getElementById("content").innerHTML = `
        <div class="card">
          <div class="match-name">${a.home} vs ${a.away}</div>
          <div class="match-league">${a.league}${a.kickoff ? " · " + formatKickoff(a.kickoff) : ""} · ${srcLabel}</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
            <span class="badge ${pickBadgeClass(a.pickSide)}">${a.pick}</span>
            <span class="badge ${riskBadgeClass(a.riskLevel)}">风险${a.risk}</span>
            <span class="stars">${a.starStr}</span>
          </div>
        </div>

        <div class="card">
          <div class="card-title">AI 深度分析</div>
          <div class="report report-block">${a.report}</div>
        </div>

        <div class="card">
          <div class="card-title">最终建议</div>
          <div class="report ${a.riskLevel === "low" ? "success" : a.riskLevel === "high" ? "danger" : ""}">
            推荐：<strong>${a.pick}</strong><br>
            风险：${a.risk}<br>
            综合评分：主 ${a.homeScore} / 客 ${a.awayScore}<br>
            预测比分：<strong>${a.predScore}</strong>${a.predScoreProb ? `（约 ${a.predScoreProb}%）` : ""}<br>
            ${a.altScores && a.altScores.length ? "备选：" + a.altScores.join("、") : ""}
          </div>
        </div>

        <div class="card">
          <div class="card-title">胜平负概率</div>
          <div class="info-grid">
            <div class="info-item">
              <div class="label">主胜</div>
              <div class="value">${a.homeProb}%</div>
              <div class="prob-bar"><div class="prob-bar-fill prob-home" style="width:${a.homeProb}%"></div></div>
            </div>
            <div class="info-item">
              <div class="label">平局</div>
              <div class="value">${a.drawProb}%</div>
              <div class="prob-bar"><div class="prob-bar-fill prob-draw" style="width:${a.drawProb}%"></div></div>
            </div>
            <div class="info-item">
              <div class="label">客胜</div>
              <div class="value">${a.awayProb}%</div>
              <div class="prob-bar"><div class="prob-bar-fill prob-away" style="width:${a.awayProb}%"></div></div>
            </div>
            <div class="info-item">
              <div class="label">预测比分</div>
              <div class="value">${a.predScore}</div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-title">赔率（联网书商均值）</div>
          <div class="info-grid">
            <div class="info-item"><div class="label">主胜</div><div class="value">${m.odds?.home ?? "-"}</div></div>
            <div class="info-item"><div class="label">平局</div><div class="value">${m.odds?.draw ?? "-"}</div></div>
            <div class="info-item"><div class="label">客胜</div><div class="value">${m.odds?.away ?? "-"}</div></div>
          </div>
        </div>

        <div class="card">
          <div class="card-title">模型指标</div>
          <div class="info-grid">
            <div class="info-item"><div class="label">${a.home} 实力</div><div class="value">${m.strength?.home ?? "-"}</div></div>
            <div class="info-item"><div class="label">${a.away} 实力</div><div class="value">${m.strength?.away ?? "-"}</div></div>
            <div class="info-item"><div class="label">${a.home} xG</div><div class="value">${m.xg?.home ?? "-"}</div></div>
            <div class="info-item"><div class="label">${a.away} xG</div><div class="value">${m.xg?.away ?? "-"}</div></div>
          </div>
        </div>

        <a class="btn btn-dark" href="matches.html">← 返回比赛列表</a>
      `;
    }

    loadMatches()
      .then(data => {
        let match = findMatch(data, gameId);
        if (!match) {
          try {
            const cached = JSON.parse(sessionStorage.getItem("fa_matches") || "[]");
            match = findMatch(cached, gameId);
          } catch (_) {}
        }
        if (!match) {
          document.getElementById("content").innerHTML = `
            <div class="card">
              <div class="report danger">未找到该场比赛</div>
              <p style="color:var(--text-muted);font-size:0.9rem;margin-top:12px">
                可能是数据已刷新。请从比赛列表重新进入。
              </p>
              <a class="btn btn-primary" href="matches.html">返回比赛列表</a>
            </div>`;
          return;
        }
        render(match);
      })
      .catch(err => {
        document.getElementById("content").innerHTML =
          `<div class="card"><div class="report danger">${err.message}</div></div>`;
      });
  </script>
</body>
</html>
