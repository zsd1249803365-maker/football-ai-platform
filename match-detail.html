<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>比赛详情 - Football AI</title>
  <link rel="stylesheet" href="css/style.css?v=6.2">
  <style>
    .report-block{white-space:pre-wrap;line-height:1.8;font-size:0.9rem}
    .form-match {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 0.85rem;
    }
    .form-badge {
      min-width: 42px; text-align: center; font-weight: 800; font-size: 0.9rem;
      font-variant-numeric: tabular-nums; padding: 4px 6px; border-radius: 6px;
    }
    .form-badge.win { background: rgba(239,68,68,0.15); color: #ef4444; }
    .form-badge.draw { background: rgba(59,130,246,0.15); color: #3b82f6; }
    .form-badge.lose { background: rgba(100,116,139,0.2); color: #94a3b8; }
  </style>
</head>
<body>
  <div class="header">
    <h1>⚽ 比赛详情 <span class="version">v6.2</span></h1>
    <p>赔率 · 积分 · 战绩（红胜蓝平）</p>
  </div>

  <nav class="nav">
    <a href="index.html">🏠 首页</a>
    <a href="matches.html" class="active">⚽ 比赛</a>
    <a href="ai-bet.html">🎫 方案</a>
    <a href="results.html">📋 赛果</a>
  </nav>

  <div class="container" id="content">
    <div class="loading">加载详情...</div>
  </div>

  <div class="footer">Football AI v6.2</div>

  <script src="js/score.js?v=6.2"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const gameId = params.get("game");

    async function loadContext(league, homeEn, awayEn) {
      try {
        const q = new URLSearchParams({
          league: league || "",
          home: homeEn || "",
          away: awayEn || "",
          t: Date.now(),
        });
        const res = await fetch("/api/context?" + q);
        if (!res.ok) return { ok: false, message: "HTTP " + res.status };
        return await res.json();
      } catch (e) {
        return { ok: false, message: String(e.message || e) };
      }
    }

    function renderStandTable(rows, title, note) {
      if (!rows || !rows.length) {
        return `<div class="report">暂无积分数据<br><span style="font-size:0.8rem">${note || ""}</span></div>`;
      }
      const allZero = rows.every(r => !r.played);
      let html = `<div style="font-size:0.82rem;margin-bottom:8px;color:var(--text-muted)">${title}
        <span style="color:var(--text-dim);font-size:0.72rem"> · ${note || ""}</span></div>`;
      if (allZero) {
        html += `<div class="report" style="margin-bottom:10px">本赛季场次多为 0（休赛/新赛季刚开），以下为当前积分榜结构。</div>`;
      }
      html += `<table class="stand-table"><thead><tr>
        <th>#</th><th class="team">球队</th><th>赛</th><th>胜</th><th>平</th><th>负</th><th>进</th><th>失</th><th>积分</th>
      </tr></thead><tbody>`;
      rows.forEach(r => {
        const cls = r.zone === "promo" ? "stand-row-promo" : r.zone === "releg" ? "stand-row-releg" : "";
        const bold = r.isFocus ? "font-weight:800;color:var(--primary)" : "";
        html += `<tr class="${cls}">
          <td>${r.rank}</td><td class="team" style="${bold}">${r.name}</td>
          <td>${r.played}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td>
          <td>${r.gf}</td><td>${r.ga}</td><td><strong>${r.pts}</strong></td></tr>`;
      });
      html += `</tbody></table>
        <div class="legend">
          <span><i style="background:#10b981"></i> 争冠/欧战</span>
          <span><i style="background:#64748b"></i> 中游</span>
          <span><i style="background:#ef4444"></i> 保级/降级</span>
        </div>`;
      return html;
    }

    /** 战绩：写清对阵，胜红 平蓝 负灰，不用 WDL */
    function formList(form, focusName) {
      if (!form || !form.length) {
        return `<div class="report">暂无近期赛果（该联赛往绩未返回或队名未匹配）</div>`;
      }
      return form.map(f => {
        const cls = f.outcome === "win" ? "win" : f.outcome === "draw" ? "draw" : "lose";
        const label = f.outcome === "win" ? "胜" : f.outcome === "draw" ? "平" : "负";
        const vs = f.isHome
          ? `${focusName || "本队"} ${f.score} ${f.opponent}`
          : `${f.opponent} ${f.score} ${focusName || "本队"}`;
        const line = f.isHome
          ? `主场 vs ${f.opponent}`
          : `客场 vs ${f.opponent}`;
        return `<div class="form-match">
          <div class="form-badge ${cls}">${f.score}</div>
          <div style="flex:1">
            <div>${line} <span style="color:var(--text-dim)">（${label}）</span></div>
            <div class="h2h-meta">${f.competition || ""} · ${f.date || ""}</div>
          </div>
        </div>`;
      }).join("");
    }

    function render(match, ctx) {
      const a = analyzeMatch(match);
      const m = match;
      const od = a.odds || {};
      const ah = a.asian || {};
      const tt = a.totals || {};
      const stand = ctx?.standings || [];
      const formH = ctx?.formHome || [];
      const formA = ctx?.formAway || [];
      const h2h = ctx?.h2h || [];
      const ctxNote = ctx?.ok
        ? (ctx.note || "TheSportsDB") + (ctx.season ? " · " + ctx.season : "")
        : (ctx?.message || "未覆盖");

      document.getElementById("content").innerHTML = `
        <div class="card">
          <div class="match-name">${a.home} vs ${a.away}</div>
          <div class="match-league">${a.league} · ${formatKickoff(a.kickoff) || "时间待定"}</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
            <span class="badge ${pickBadgeClass(a.pickSide)}">${a.pick}</span>
            <span class="badge ${riskBadgeClass(a.riskLevel)}">风险${a.risk}</span>
            <span class="stars">${a.starStr}</span>
          </div>
        </div>

        <div class="sec-tabs">
          <button type="button" class="sec-tab active" data-sec="odds">赔率区</button>
          <button type="button" class="sec-tab" data-sec="table">积分区</button>
          <button type="button" class="sec-tab" data-sec="form">战绩区</button>
          <button type="button" class="sec-tab" data-sec="injury">伤停区</button>
          <button type="button" class="sec-tab" data-sec="ai">AI分析</button>
        </div>

        <div class="sec-panel active" id="sec-odds">
          <div class="card">
            <div class="card-title">赔率区</div>
            <table class="odds-table">
              <thead><tr><th class="book">公司</th><th>主</th><th>平</th><th>客</th><th>让球</th><th>大</th><th>小</th></tr></thead>
              <tbody>
                <tr>
                  <td class="book">均值</td>
                  <td>${od.home ?? "-"}</td><td>${od.draw ?? "-"}</td><td>${od.away ?? "-"}</td>
                  <td>${ah.line && ah.line !== "-" ? ah.line : "-"}</td>
                  <td>${tt.over ?? "-"}</td><td>${tt.under ?? "-"}</td>
                </tr>
              </tbody>
            </table>
            <div style="margin-top:12px;font-size:0.9rem">
              预测 <strong style="color:var(--primary)">${a.predScore}</strong>
              （${a.predScoreProb ?? "-"}%）· 备选 ${(a.altScoresText||[]).join(" · ") || "-"}<br>
              <span style="color:var(--primary)">主${a.homeProb}% 平${a.drawProb}% 客${a.awayProb}%</span>
            </div>
          </div>
        </div>

        <div class="sec-panel" id="sec-table">
          <div class="card">
            <div class="card-title">积分区</div>
            ${renderStandTable(stand, a.league + " 积分榜", ctxNote)}
          </div>
        </div>

        <div class="sec-panel" id="sec-form">
          <div class="card">
            <div class="card-title">${a.home} 近期战绩</div>
            <div class="legend" style="margin-bottom:8px">
              <span><i style="background:#ef4444"></i> 胜（红）</span>
              <span><i style="background:#3b82f6"></i> 平（蓝）</span>
              <span><i style="background:#64748b"></i> 负（灰）</span>
            </div>
            ${formList(formH, match.home)}
          </div>
          <div class="card">
            <div class="card-title">${a.away} 近期战绩</div>
            ${formList(formA, match.away)}
          </div>
          <div class="card">
            <div class="card-title">历史交锋</div>
            ${h2h.length ? h2h.map(h => {
              const scClass = h.result === "draw" ? "draw" : "win";
              return `<div class="form-match">
                <div class="form-badge ${scClass}">${h.score}</div>
                <div style="flex:1">
                  <div>${h.home} vs ${h.away}</div>
                  <div class="h2h-meta">${h.competition} · ${h.date}</div>
                </div>
              </div>`;
            }).join("") : `<div class="report">暂无交锋记录<br><span style="font-size:0.8rem">${ctxNote}</span></div>`}
          </div>
        </div>

        <div class="sec-panel" id="sec-injury">
          <div class="card">
            <div class="card-title">伤停区</div>
            <div class="report">伤停需 API-Football 等源，当前未接入，不展示假数据。</div>
          </div>
        </div>

        <div class="sec-panel" id="sec-ai">
          <div class="card">
            <div class="card-title">AI 分析</div>
            <div class="report report-block">${a.report}</div>
          </div>
        </div>

        <a class="btn btn-dark" href="matches.html">← 返回列表</a>
      `;

      document.querySelectorAll(".sec-tab").forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll(".sec-tab").forEach(b => b.classList.remove("active"));
          document.querySelectorAll(".sec-panel").forEach(p => p.classList.remove("active"));
          btn.classList.add("active");
          document.getElementById("sec-" + btn.dataset.sec).classList.add("active");
        };
      });
    }

    loadMatches().then(async data => {
      let match = findMatch(data || [], gameId);
      if (!match) {
        try { match = findMatch(JSON.parse(sessionStorage.getItem("fa_matches") || "[]"), gameId); } catch(_){}
      }
      if (!match) {
        document.getElementById("content").innerHTML =
          `<div class="card"><div class="report danger">未找到比赛</div>
           <a class="btn btn-primary" href="matches.html">返回</a></div>`;
        return;
      }
      // 必须用英文原名请求 context（TheSportsDB 是英文队名）
      const ctx = await loadContext(match.league, match.home, match.away);
      render(match, ctx);
    }).catch(err => {
      document.getElementById("content").innerHTML =
        `<div class="card"><div class="report danger">${err.message}</div></div>`;
    });
  </script>
</body>
</html>
