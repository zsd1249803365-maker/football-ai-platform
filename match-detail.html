<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Football AI 分析</title>

<style>

body{
margin:0;
padding:20px;
font-family:Arial,sans-serif;
background:#f3f4f6;
}

.header{
background:#111827;
color:white;
padding:25px;
border-radius:18px;
text-align:center;
}

.card{
background:white;
padding:20px;
margin-top:20px;
border-radius:18px;
box-shadow:0 3px 10px #ddd;
}

.title{
font-size:20px;
font-weight:bold;
margin-bottom:15px;
}

.info{
font-size:17px;
line-height:32px;
}

.report{
background:#fff7ed;
border-left:5px solid #f97316;
padding:18px;
font-size:17px;
line-height:32px;
}

.score{
font-size:25px;
font-weight:bold;
}

.back{
display:block;
margin-top:25px;
padding:15px;
background:#111827;
color:white;
text-align:center;
border-radius:12px;
text-decoration:none;
}

</style>

</head>


<body>


<div class="header">

<h1>⚽ Football AI</h1>

<p>竞彩智能分析系统 v3.2</p>

</div>


<div class="card">

<div class="title">
比赛
</div>

<h2 id="matchName">
加载中...
</h2>

<p id="league"></p>

</div>


<div class="card">

<div class="title">
🤖 AI赛前报告
</div>

<div id="aiReport" class="report">
正在生成分析...
</div>

</div>


<div class="card">

<div class="title">
🎯 AI最终建议
</div>

<div id="aiAdvice" class="report">
正在生成建议...
</div>

</div>


<div class="card">

<div class="title">
🎫 AI竞彩策略
</div>

<div id="betAdvice" class="report">
正在生成竞彩方案...
</div>

</div>


<div class="card">

<div class="title">
🔥 球队实力
</div>

<div id="strength" class="info"></div>

</div>


<div class="card">

<div class="title">
📊 状态
</div>

<div id="form" class="info"></div>

</div>


<div class="card">

<div class="title">
📈 xG数据
</div>

<div id="xg" class="info"></div>

</div>


<div class="card">

<div class="title">
🛡 防守能力
</div>

<div id="defense" class="info"></div>

</div>


<div class="card">

<div class="title">
💰 欧赔
</div>

<div id="odds" class="info"></div>

</div>


<div class="card">

<div class="title">
⚽ 竞彩盘口
</div>

<div id="market" class="info"></div>

</div>


<div class="card">

<div class="title">
📉 盘口走势
</div>

<div id="marketAnalysis" class="info"></div>

</div>


<div class="card">

<div class="title">
🤖 AI盘口修正
</div>

<div id="aiMarket" class="info"></div>

</div><div class="card">

<div class="title">
🚑 伤停影响
</div>

<div id="injury" class="info"></div>

</div>


<div class="card">

<div class="title">
🔥 战意分析
</div>

<div id="motivation" class="info"></div>

</div>


<div class="card">

<div class="title">
⏱ 赛程消耗
</div>

<div id="schedule" class="info"></div>

</div>


<div class="card">

<div class="title">
🔄 轮换风险
</div>

<div id="rotation" class="info"></div>

</div>


<div class="card">

<div class="title">
🎯 风格对抗
</div>

<div id="styleMatch" class="info"></div>

</div>


<div class="card">

<div class="title">
💰 市场资金分析
</div>

<div id="marketLogic" class="info"></div>

</div>


<div class="card">

<div class="title">
🤖 AI综合评分
</div>

<div id="aiScore" class="score"></div>

</div>


<div class="card">

<div class="title">
📊 胜平负概率
</div>

<div id="probability" class="info"></div>

</div>


<div class="card">

<div class="title">
⚠️ 风险等级
</div>

<div id="risk" class="score"></div>

</div>


<a class="back" href="matches.html">
返回比赛列表
</a>


<script>


let params=new URLSearchParams(window.location.search);

let game=params.get("game");


fetch("matches.json")

.then(res=>res.json())

.then(data=>{


let match=data.find(item=>item.id==game);


if(!match){

document.getElementById("matchName").innerHTML="未找到比赛";

return;

}



document.getElementById("matchName").innerHTML=
match.home+" VS "+match.away;


document.getElementById("league").innerHTML=
match.league;



document.getElementById("strength").innerHTML=
match.home+"："+match.strength.home+
"<br>"+
match.away+"："+match.strength.away;



document.getElementById("form").innerHTML=
match.home+"："+match.form.detail.home+
"<br>"+
match.away+"："+match.form.detail.away;



document.getElementById("xg").innerHTML=
match.home+"："+match.xg.home+
"<br>"+
match.away+"："+match.xg.away;



document.getElementById("defense").innerHTML=
match.home+"："+match.defense.home+
"<br>"+
match.away+"："+match.defense.away;



document.getElementById("odds").innerHTML=
"主胜："+match.odds.home+
"<br>平："+match.odds.draw+
"<br>客胜："+match.odds.away;



document.getElementById("market").innerHTML=
"让球："+match.market.asian_handicap.line+
"<br>主队："+match.market.asian_handicap.home+
"<br>客队："+match.market.asian_handicap.away;



document.getElementById("marketAnalysis").innerHTML=
"走势："+match.market_analysis.trend+
"<br>热度："+match.market_analysis.heat+
"<br>风险："+match.market_analysis.risk_note;



document.getElementById("aiMarket").innerHTML=
"赔率影响："+match.ai_market.odds_change+
"<br>热门风险："+match.ai_market.heat_risk+
"<br>盘口支持："+match.ai_market.handicap_support+
"<br><br>"+
match.ai_market.analysis;function injuryText(team){

if(!team.players||team.players.length==0){

return "无重要伤停";

}

let txt="";


team.players.forEach(function(p){

txt+=
p.name+
"（"+
p.position+
"）影响："+p.impact+
"<br>";

});


return txt+"总影响："+team.totalImpact;

}



document.getElementById("injury").innerHTML=

match.home+"：<br>"+
injuryText(match.injury.home)+
"<br><br>"+
match.away+"：<br>"+
injuryText(match.injury.away);



document.getElementById("motivation").innerHTML=
match.motivation.level+
"（影响："+match.motivation.impact+"）";



document.getElementById("schedule").innerHTML=
"最近比赛："+match.schedule.recent_match+
"<br>疲劳："+match.schedule.fatigue;



document.getElementById("rotation").innerHTML=
"风险："+match.rotation.risk+
"<br>影响："+match.rotation.impact;



document.getElementById("styleMatch").innerHTML=
match.style_match.matchup+
"<br>AI修正："+match.style_match.impact;



document.getElementById("marketLogic").innerHTML=
"热门："+match.market_logic.popular_side+
"<br>冷门："+match.market_logic.cold_side+
"<br>庄家："+match.market_logic.bookmaker_signal+
"<br>修正："+match.market_logic.impact;





let score=

80+

(match.strength.home-match.strength.away)*0.3+

(match.form.home-match.form.away)*0.2+

(match.xg.home-match.xg.away)*10+

(match.defense.home-match.defense.away)*0.15+

match.ai_market.odds_change+

match.ai_market.handicap_support+

match.ai_market.heat_risk+

match.injury.home.totalImpact+

match.motivation.impact+

match.schedule.fatigue+

match.rotation.impact+

match.style_match.impact+

match.market_logic.impact;



let awayScore=

160-score+
match.injury.away.totalImpact;



document.getElementById("aiScore").innerHTML=

match.home+"："+score.toFixed(1)+
"<br>"+
match.away+"："+awayScore.toFixed(1);





let diff=score-awayScore;


let homeProb=Math.max(5,33+diff*1.5);

let awayProb=Math.max(5,33-diff*1.2);

let drawProb=100-homeProb-awayProb;



document.getElementById("probability").innerHTML=

"主胜："+homeProb.toFixed(1)+"%"+
"<br>平："+drawProb.toFixed(1)+"%"+
"<br>客胜："+awayProb.toFixed(1)+"%";



document.getElementById("risk").innerHTML=
match.risk;



let report=

"本场比赛："+match.home+
" VS "+
match.away+
"<br><br>"+

"实力分析："+

(match.strength.home>match.strength.away?
match.home+"占优":
"双方接近")+

"<br><br>"+

"盘口分析："+match.market_analysis.trend+

"<br><br>"+

"伤停影响：主队"+
match.injury.home.totalImpact+
"，客队"+
match.injury.away.totalImpact;



document.getElementById("aiReport").innerHTML=
report;// AI最终建议

let result="";


if(homeProb>awayProb&&homeProb>drawProb){

result="主胜";

}
else if(awayProb>homeProb&&awayProb>drawProb){

result="客胜";

}
else{

result="平局";

}



let safe="";


if(Math.abs(homeProb-awayProb)<10){

safe="防平";

}
else if(homeProb>awayProb){

safe="主队不败";

}
else{

safe="客队不败";

}



let advice=

"胜平负倾向："+result+
"<br><br>"+
"稳健方向："+safe+
"<br><br>"+
"预测比分："+

(score>awayScore?
"2-1 / 2-0":
"1-2 / 0-1")+

"<br><br>"+
"推荐等级：⭐⭐⭐⭐";



document.getElementById("aiAdvice").innerHTML=
advice;





// AI竞彩策略

let bet="";



if(homeProb>60){

bet+="胜平负：主胜<br><br>";

}
else if(awayProb>60){

bet+="胜平负：客胜<br><br>";

}
else{

bet+="胜平负：防平<br><br>";

}



if(score-awayScore>15){

bet+="让球胜平负：让胜<br><br>";

}
else if(score-awayScore<-15){

bet+="让球胜平负：让负<br><br>";

}
else{

bet+="让球胜平负：让平<br><br>";

}



bet+="比分预测："+
(score>awayScore?
"2-1 / 2-0":
"1-2 / 0-1")+
"<br><br>";



bet+="总进球：2-3球<br><br>";



bet+="半全场："+
(score>awayScore?
"胜胜 / 胜平":
"负负 / 平负")+
"<br><br>";



if(Math.abs(homeProb-awayProb)<10){

bet+="投注风险：高";

}
else if(Math.abs(homeProb-awayProb)<20){

bet+="投注风险：中";

}
else{

bet+="投注风险：低";

}



document.getElementById("betAdvice").innerHTML=
bet;



});


</script>


</body>

</html>
