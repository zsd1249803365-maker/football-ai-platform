<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>比赛详情 - Football AI</title>
  <link rel="stylesheet" href="css/style.css?v=6.1">
  <style>.report-block{white-space:pre-wrap;line-height:1.8;font-size:0.9rem}</style>
</head>
<body>
  <div class="header">
    <h1>⚽ 比赛详情 <span class="version">v6.1</span></h1>
    <p>真实赔率 · 真实积分/战绩（TheSportsDB）</p>
  </div>

  <nav class="nav">
    <a href="index.html">🏠 首页</a>
    <a href="matches.html" class="active">⚽ 比赛</a>
    <a href="ai-bet.html">🎫 方案</a>
    <a href="results.html">📋 赛果</a>
  </nav>

  <div class="container" id="content">
    <div class="loading">加载详情...</div>
  </div>

  <div class="footer">Football AI v6.1</div>

  <script src="js/score.js?v=6.1"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const gameId = params.get("game");

    async function loadContext(league, homeEn, awayEn, homeZh, awayZh) {
      try {
        const q = new URLSearchParams({
          league: league || "",
          home: homeEn || homeZh || "",
          away: awayEn || awayZh || "",
          t: Date.now(),
        });
        const res = await fetch("/api/context?" + q);
        if (!res.ok) return null;
        return await res.json();
      } catch {
        return null;
      }
    }

    function renderStandTable(rows, title, note) {
      if (!rows || !rows.length) {
        return `<div class="report">暂无积分数据${note ? "（" + note + "）" : ""}</div>`;
      }
      let html = `<div style="font-size:0.82rem;margin-bottom:8px;color:var(--text-muted)">${title}
        <span style="color:var(--text-dim);font-size:0.72rem"> · ${note || "TheSportsDB"}</span></div>`;
      html += `<table class="stand-table"><thead><tr>
        <th>#</th><th class="team">球队</th><th>赛</th><th>胜</th><th>平</th><th>负</th><th>进</th><th>失</th><th>积分</th>
      </tr></thead><tbody>`;
      rows.forEach(r => {
        const cls = r.zone === "promo" ? "stand-row-promo" : r.zone === "releg" ? "stand-row-releg" : "";
        const bold = r.isFocus ? "font-weight:800;color:var(--primary)" : "";
        html += `<tr class="${cls}">
          <td>${r.rank}</td>
          <td class="team" style="${bold}">${r.name}</td>
          <td>${r.played}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td>
          <td>${r.gf}</td><td>${r.ga}</td><td><strong>${r.pts}</strong></td>
        </tr>`;
      });
      html += `</tbody></table>
        <div class="legend">
          <span><i style="background:#10b981"></i> 争冠/欧战区</span>
          <span><i style="background:#64748b"></i> 中游</span>
          <span><i style="background:#ef4444"></i> 保级/降级区</span>
        </div>`;
      return html;
    }

    function formDots(form) {
      if (!form || !form.length) return `<div class="report">暂无近期赛果</div>`;
      const dots = form.map(f => {
        const r = f.result || f;
        const letter = typeof r === "string" && r.length === 1 ? r : (f.result || "D");
        return `<span class="form-dot form-${letter.toLowerCase()}" title="${f.score || ""} ${f.date || ""}">${letter}</span>`;
      }).join("");
      return `<div class="form-row">${dots}</div>`;
    }

    function formList(form) {
      if (!form || !form.length) return "";
      return form.slice(0, 8).map(f => `
        <div class="h2h-item">
          <div class="h2h-score ${f.result === "W" ? "win" : f.result === "D" ? "draw" : ""}">${f.score || f.result}</div>
          <div style="flex:1">
            <div style="font-size:0.82rem">${f.home} vs ${f.away}</div>
            <div class="h2h-meta">${f.competition || ""} · ${f.date || ""}</div>
          </div>
        </div>`).join("");
    }

    function render(match, ctx) {
      const a = analyzeMatch(match);
      const m = match;
      const od = a.odds || {};
      const ah = a.asian || {};
      const tt = a.totals || {};
      const stand = ctx?.standings || [];
      const formH = ctx?.formHome || [];
      const formA = ctx?.formAway || [];
      const h2h = ctx?.h2h || [];
      const ctxNote = ctx?.ok
        ? (ctx.note || "TheSportsDB") + (ctx.season ? " · " + ctx.season : "")
        : (ctx?.message || "该联赛暂无积分接口");

      document.getElementById("content").innerHTML = `
        <div class="card">
          <div class="match-name">${a.home} vs ${a.away}</div>
          <div class="match-league">${a.league} · ${formatKickoff(a.kickoff) || "时间待定"}</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
            <span class="badge ${pickBadgeClass(a.pickSide)}">${a.pick}</span>
            <span class="badge ${riskBadgeClass(a.riskLevel)}">风险${a.risk}</span>
            <span class="stars">${a.starStr}</span>
          </div>
        </div>

        <div class="sec-tabs" id="tabs">
          <button type="button" class="sec-tab active" data-sec="odds">赔率区</button>
          <button type="button" class="sec-tab" data-sec="intel">情报区</button>
          <button type="button" class="sec-tab" data-sec="table">积分区</button>
          <button type="button" class="sec-tab" data-sec="form">战绩区</button>
          <button type="button" class="sec-tab" data-sec="injury">伤停区</button>
          <button type="button" class="sec-tab" data-sec="ai">AI分析</button>
        </div>

        <div class="sec-panel active" id="sec-odds">
          <div class="card">
            <div class="card-title">赔率区 · 书商均值（联网）</div>
            <table class="odds-table">
              <thead>
                <tr><th class="book">公司</th><th>主胜</th><th>平局</th><th>客胜</th><th>让球</th><th>大球</th><th>小球</th></tr>
              </thead>
              <tbody>
                <tr>
                  <td class="book">综合均值</td>
                  <td>${od.home ?? "-"}</td><td>${od.draw ?? "-"}</td><td>${od.away ?? "-"}</td>
                  <td>${ah.line && ah.line !== "-" ? ah.line : "-"}</td>
                  <td>${tt.over ?? "-"}</td><td>${tt.under ?? "-"}</td>
                </tr>
                <tr>
                  <td class="book">让球水位</td>
                  <td colspan="3" style="color:var(--text-dim)">主 ${ah.home ?? "-"} / 客 ${ah.away ?? "-"}</td>
                  <td colspan="3" style="color:var(--text-dim)">大小线 ${tt.line || "2.5"}</td>
                </tr>
              </tbody>
            </table>
          </div>
          <div class="card">
            <div class="card-title">预测比分</div>
            <div style="font-size:0.9rem">
              主推 <strong style="font-size:1.2rem;color:var(--primary)">${a.predScore}</strong>
              （约 ${a.predScoreProb ?? "-"}%）
              <div style="margin-top:8px;color:var(--text-muted);font-size:0.82rem">备选 ${(a.altScoresText||[]).join(" · ") || "-"}</div>
              <div style="margin-top:8px;color:var(--primary)">主${a.homeProb}% · 平${a.drawProb}% · 客${a.awayProb}%</div>
            </div>
          </div>
        </div>

        <div class="sec-panel" id="sec-intel">
          <div class="card">
            <div class="card-title">情报区</div>
            <div style="font-size:0.88rem;color:var(--text-muted);line-height:1.7">
              <div>· 联赛：${a.league}</div>
              <div>· 开赛：${formatKickoff(a.kickoff) || "待定"}</div>
              <div>· 盘口热度：${m.market_analysis?.heat || "-"} · ${m.market_analysis?.risk_note || ""}</div>
              <div>· 赔率源：${a.source === "odds-api" ? "The Odds API 实时" : "估算"}</div>
              <div>· 积分/战绩源：${ctx?.ok ? "TheSportsDB" : "未覆盖该联赛"}</div>
            </div>
            <div class="report" style="margin-top:12px">新闻类情报需要专门新闻源，当前未接入爬虫。</div>
          </div>
        </div>

        <div class="sec-panel" id="sec-table">
          <div class="card">
            <div class="card-title">积分区</div>
            ${renderStandTable(stand, (a.league || "") + " 积分榜", ctxNote)}
          </div>
        </div>

        <div class="sec-panel" id="sec-form">
          <div class="card">
            <div class="card-title">战绩区 · ${a.home} 近况</div>
            ${formDots(formH)}
            <div class="legend" style="margin-top:8px">
              <span><i style="background:var(--win)"></i> 胜(红)</span>
              <span><i style="background:var(--draw)"></i> 平(蓝)</span>
              <span><i style="background:var(--lose)"></i> 负(灰)</span>
            </div>
            ${formList(formH)}
          </div>
          <div class="card">
            <div class="card-title">战绩区 · ${a.away} 近况</div>
            ${formDots(formA)}
            ${formList(formA)}
          </div>
          <div class="card">
            <div class="card-title">历史交锋</div>
            ${h2h.length ? h2h.map(h => {
              const scClass = h.result === "draw" ? "draw" : "win";
              return `<div class="h2h-item">
                <div class="h2h-score ${scClass}">${h.score}</div>
                <div style="flex:1">
                  <div>${h.home} vs ${h.away}</div>
                  <div class="h2h-meta">${h.competition} · ${h.date}</div>
                </div>
              </div>`;
            }).join("") : `<div class="report">暂无交锋记录（或该联赛往绩未收录）</div>`}
          </div>
        </div>

        <div class="sec-panel" id="sec-injury">
          <div class="card">
            <div class="card-title">伤停区</div>
            <div class="report">
              伤停/停赛需要 API-Football 等付费或注册源（免费档每日次数很少）。
              当前未接入，避免用假名单误导。有 Key 后可直接填入此区。
            </div>
          </div>
        </div>

        <div class="sec-panel" id="sec-ai">
          <div class="card">
            <div class="card-title">AI 多维分析</div>
            <div class="report report-block">${a.report}</div>
          </div>
          <div class="card">
            <div class="card-title">最终建议</div>
            <div class="report ${a.riskLevel==="low"?"success":a.riskLevel==="high"?"danger":""}">
              推荐：<strong>${a.pick}</strong> · 风险 ${a.risk}<br>
              评分 主 ${a.homeScore} / 客 ${a.awayScore}<br>
              比分 ${a.predScore}${a.predScoreProb?`（${a.predScoreProb}%）`:""}
            </div>
          </div>
        </div>

        <a class="btn btn-dark" href="matches.html">← 返回比赛列表</a>
      `;

      document.querySelectorAll(".sec-tab").forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll(".sec-tab").forEach(b => b.classList.remove("active"));
          document.querySelectorAll(".sec-panel").forEach(p => p.classList.remove("active"));
          btn.classList.add("active");
          document.getElementById("sec-" + btn.dataset.sec).classList.add("active");
        };
      });
    }

    loadMatches().then(async data => {
      let match = findMatch(data || [], gameId);
      if (!match) {
        try { match = findMatch(JSON.parse(sessionStorage.getItem("fa_matches") || "[]"), gameId); } catch(_){}
      }
      if (!match) {
        document.getElementById("content").innerHTML = `
          <div class="card"><div class="report danger">未找到该场比赛</div>
          <a class="btn btn-primary" href="matches.html">返回列表</a></div>`;
        return;
      }
      const a = analyzeMatch(match);
      const ctx = await loadContext(match.league, match.home, match.away, a.home, a.away);
      render(match, ctx);
    }).catch(err => {
      document.getElementById("content").innerHTML =
        `<div class="card"><div class="report danger">${err.message}</div></div>`;
    });
  </script>
</body>
</html>
