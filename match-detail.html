<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Football AI - 比赛分析</title>


<style>

body{
    margin:0;
    padding:20px;
    font-family:Arial,sans-serif;
    background:#f4f6f8;
}


.header{

    background:#111827;
    color:white;
    padding:25px;
    text-align:center;
    border-radius:18px;

}


.card{

    background:white;
    margin-top:20px;
    padding:20px;
    border-radius:18px;
    box-shadow:0 3px 10px #ddd;

}


.title{

    font-size:20px;
    font-weight:bold;
    margin-bottom:15px;

}


.info{

    font-size:18px;
    line-height:35px;

}


.score{

    font-size:30px;
    font-weight:bold;

}


.button{

    display:block;
    margin-top:20px;
    background:#111827;
    color:white;
    text-align:center;
    padding:12px;
    border-radius:12px;
    text-decoration:none;

}


</style>


</head>



<body>


<div class="header">

<h1>⚽ Football AI</h1>

<p>AI比赛深度分析</p>

</div>



<div class="card">

<div class="title">
比赛
</div>

<h2 id="matchName">
加载中...
</h2>

<p id="league"></p>

</div>




<div class="card">

<div class="title">
📊 胜平负预测
</div>


<div class="info" id="result">

加载中...

</div>


</div>





<div class="card">

<div class="title">
🎯 AI比分预测
</div>


<div class="score" id="score">

加载中...

</div>


</div>





<div class="card">

<div class="title">
🤖 AI模型评分
</div>


<div class="info">

<p id="attack"></p>

<p id="defense"></p>

<p id="form"></p>


</div>


</div>




<a class="button" href="matches.html">

返回赛事列表

</a>





<script>


let params = new URLSearchParams(window.location.search);

let game = params.get("game");



fetch("matches.json")

.then(response => response.json())

.then(data => {


let match = data.find(item => item.id == game);



if(match){


document.getElementById("matchName").innerHTML =
match.home + " VS " + match.away;



document.getElementById("league").innerHTML =
match.league;



document.getElementById("result").innerHTML =

"主胜：" + match.win +
"<br>平局：" + match.draw +
"<br>客胜：" + match.lose;



document.getElementById("score").innerHTML =
match.score;



document.getElementById("attack").innerHTML =
"攻击力：" + match.attack;



document.getElementById("defense").innerHTML =
"防守力：" + match.defense;



document.getElementById("form").innerHTML =
"近期状态：" + match.form;



}



else{


document.getElementById("matchName").innerHTML =
"未找到比赛";


}



});


</script>



</body>

</html>
