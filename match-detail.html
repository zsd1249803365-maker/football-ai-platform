<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Football AI 分析</title>

<style>

body{
margin:0;
padding:20px;
font-family:Arial;
background:#f3f4f6;
}

.header{
background:#111827;
color:white;
padding:25px;
border-radius:18px;
text-align:center;
}

.card{
background:white;
padding:20px;
margin-top:20px;
border-radius:18px;
box-shadow:0 3px 10px #ddd;
}

.title{
font-size:20px;
font-weight:bold;
margin-bottom:15px;
}

.info{
font-size:17px;
line-height:32px;
}

.score{
font-size:26px;
font-weight:bold;
}

.back{
display:block;
margin-top:25px;
padding:15px;
background:#111827;
color:white;
text-align:center;
border-radius:12px;
text-decoration:none;
}

</style>

</head>


<body>


<div class="header">

<h1>⚽ Football AI</h1>

<p>竞彩智能分析系统</p>

</div>



<div class="card">
<div class="title">比赛</div>
<h2 id="matchName">加载中...</h2>
<p id="league"></p>
</div>



<div class="card">
<div class="title">🔥 球队实力</div>
<div class="info" id="strength"></div>
</div>



<div class="card">
<div class="title">📊 近期状态</div>
<div class="info" id="form"></div>
</div>



<div class="card">
<div class="title">📈 xG数据</div>
<div class="info" id="xg"></div>
</div>



<div class="card">
<div class="title">🛡 防守能力</div>
<div class="info" id="defense"></div>
</div>



<div class="card">
<div class="title">💰 欧赔数据</div>
<div class="info" id="odds"></div>
</div>



<div class="card">
<div class="title">⚽ 竞彩盘口</div>
<div class="info" id="market"></div>
</div>



<div class="card">
<div class="title">📉 盘口走势</div>
<div class="info" id="marketAnalysis"></div>
</div>



<div class="card">
<div class="title">🤖 AI盘口修正</div>
<div class="info" id="aiMarket"></div>
</div>



<div class="card">
<div class="title">🚑 伤停影响分析</div>
<div class="info" id="injury"></div>
</div>



<div class="card">
<div class="title">🔥 战意分析</div>
<div class="info" id="motivation"></div>
</div>



<div class="card">
<div class="title">⏱ 赛程消耗</div>
<div class="info" id="schedule"></div>
</div>



<div class="card">
<div class="title">🔄 轮换风险</div>
<div class="info" id="rotation"></div>
</div>



<div class="card">
<div class="title">🤖 AI综合评分</div>
<div class="score" id="aiScore"></div>
</div>



<div class="card">
<div class="title">📊 AI概率模型</div>
<div class="info" id="probability"></div>
</div>



<div class="card">
<div class="title">⚠️ 风险等级</div>
<div class="score" id="risk"></div>
</div>



<a class="back" href="matches.html">
返回比赛列表
</a>



<script>


let params=new URLSearchParams(window.location.search);

let game=params.get("game");



fetch("matches.json")

.then(res=>res.json())

.then(data=>{


let match=data.find(item=>item.id==game);



if(match){


document.getElementById("matchName").innerHTML=
match.home+" VS "+match.away;


document.getElementById("league").innerHTML=
match.league;



document.getElementById("strength").innerHTML=
match.home+"："+match.strength.home+
"<br>"+
match.away+"："+match.strength.away;



document.getElementById("form").innerHTML=
match.home+"："+match.form.detail.home+
"<br>"+
match.away+"："+match.form.detail.away;



document.getElementById("xg").innerHTML=
match.home+"："+match.xg.home+
"<br>"+
match.away+"："+match.xg.away;



document.getElementById("defense").innerHTML=
match.home+"："+match.defense.home+
"<br>"+
match.away+"："+match.defense.away;



document.getElementById("odds").innerHTML=
"主胜："+match.odds.home+
"<br>平："+match.odds.draw+
"<br>客胜："+match.odds.away;



document.getElementById("market").innerHTML=
"让球："+match.market.asian_handicap.line+
"<br>"+
"主队："+match.market.asian_handicap.home+
"<br>"+
"客队："+match.market.asian_handicap.away;



document.getElementById("marketAnalysis").innerHTML=
"走势："+match.market_analysis.trend+
"<br>"+
"热度："+match.market_analysis.heat+
"<br>"+
"风险："+match.market_analysis.risk_note;



document.getElementById("aiMarket").innerHTML=
"赔率影响："+match.ai_market.odds_change+
"<br>"+
"热门风险："+match.ai_market.heat_risk+
"<br>"+
"盘口支持："+match.ai_market.handicap_support+
"<br><br>"+
match.ai_market.analysis;



function showInjury(team){

if(team.players.length==0){

return "无重要伤停";

}

let text="";

team.players.forEach(function(p){

text+=
p.name+
"（"+
p.position+
"）影响："+
p.impact+
"<br>";

});

text+="总影响："+team.totalImpact;

return text;

}



document.getElementById("injury").innerHTML=

match.home+"：<br>"+
showInjury(match.injury.home)+

"<br><br>"+

match.away+"：<br>"+
showInjury(match.injury.away);




// 战意

document.getElementById("motivation").innerHTML=

match.home+
"："+
match.motivation.level+
"（+"+
match.motivation.impact+
"）";




// 赛程

document.getElementById("schedule").innerHTML=

"最近比赛："+
match.schedule.recent_match+
"<br>"+
"疲劳影响："+

match.schedule.fatigue;



// 轮换

document.getElementById("rotation").innerHTML=

"风险："+
match.rotation.risk+
"<br>"+
"影响："+
match.rotation.impact;





// AI评分

let baseScore=

80+
(match.strength.home-match.strength.away)*0.3+
(match.form.home-match.form.away)*0.2+
(match.xg.home-match.xg.away)*10+
(match.defense.home-match.defense.away)*0.15;



let finalScore=

baseScore+
match.ai_market.odds_change+
match.ai_market.handicap_support+
match.ai_market.heat_risk+
match.injury.home.totalImpact+
match.motivation.impact+
match.schedule.fatigue+
match.rotation.impact;



let awayScore=

160-finalScore+
match.injury.away.totalImpact;



document.getElementById("aiScore").innerHTML=

match.home+"："+finalScore.toFixed(1)+
"<br>"+
match.away+"："+awayScore.toFixed(1);




let diff=finalScore-awayScore;


let homeProb=33+diff*1.5;

let awayProb=33-diff*1.2;

let drawProb=100-homeProb-awayProb;



document.getElementById("probability").innerHTML=

"主胜："+homeProb.toFixed(1)+"%"+
"<br>"+
"平："+drawProb.toFixed(1)+"%"+
"<br>"+
"客胜："+awayProb.toFixed(1)+"%";



document.getElementById("risk").innerHTML=
match.risk;


}


});

</script>


</body>

</html>
